[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-db-cloud-benchmark"
version = "0.1.0"
description = "Reproducible benchmark of CognoDB Cloud against other graph databases on identical data and workloads"
requires-python = ">=3.12"
dependencies = [
    "neo4j==6.2.0",
    "falkordb==1.7.1",
    "python-arango==8.3.3",
    "python-dotenv==1.2.3",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
gdbbench = "benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]
